<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Model & Icons Test</title>
    <style>
        body { font-family: sans-serif; background-color: #333; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        h1 { margin-bottom: 20px; }
        .icon-container { display: flex; gap: 20px; margin-bottom: 40px; }
        .icon-wrapper { text-align: center; border: 1px solid #555; padding: 10px; border-radius: 5px; background: #444; }
        img { image-rendering: pixelated; width: 64px; height: 64px; }

        /* Minecraft Character (CSS 3D) */
        .scene { width: 200px; height: 300px; perspective: 600px; margin-top: 50px; }
        .character { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; animation: rotate 5s infinite linear; }
        @keyframes rotate { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }

        .cube { position: absolute; transform-style: preserve-3d; }
        .face { position: absolute; background-size: cover; image-rendering: pixelated; border: 1px solid rgba(0,0,0,0.2); }

        /* Head */
        .head { width: 64px; height: 64px; top: 20px; left: 68px; transform-origin: center center; }
        .head .face { width: 64px; height: 64px; background-color: #FAC39C; } /* Skin color */
        .head .front { transform: translateZ(32px); background-image: url('plugins/mcreator-themes/themes/default_dark/images/mod_preview_bases/entity_base.png'); background-size: contain; background-blend-mode: multiply; background-color: #FAC39C; } /* Use new icon as face texture */
        .head .back { transform: rotateY(180deg) translateZ(32px); background-color: #3C2E24; } /* Hair */
        .head .right { transform: rotateY(90deg) translateZ(32px); background-color: #3C2E24; }
        .head .left { transform: rotateY(-90deg) translateZ(32px); background-color: #3C2E24; }
        .head .top { transform: rotateX(90deg) translateZ(32px); background-color: #3C2E24; }
        .head .bottom { transform: rotateX(-90deg) translateZ(32px); background-color: #FAC39C; }

        /* Body */
        .body-torso { width: 64px; height: 96px; top: 84px; left: 68px; }
        .body-torso .face { width: 64px; height: 96px; background-color: #008CBA; } /* Shirt */
        .body-torso .front { transform: translateZ(16px); }
        .body-torso .back { transform: rotateY(180deg) translateZ(16px); }
        .body-torso .right { transform: rotateY(90deg) translateZ(32px); width: 32px; }
        .body-torso .left { transform: rotateY(-90deg) translateZ(32px); width: 32px; }
        .body-torso .top { transform: rotateX(90deg) translateZ(48px); height: 32px; background-color: #FAC39C; } /* Neck */
        .body-torso .bottom { transform: rotateX(-90deg) translateZ(48px); height: 32px; background-color: #000080; } /* Pants start */

        /* Arms */
        .arm { width: 24px; height: 96px; top: 84px; }
        .arm-left { left: 44px; }
        .arm-right { left: 132px; }
        .arm .face { width: 24px; height: 96px; background-color: #FAC39C; } /* Skin */
        .arm .front { transform: translateZ(12px); }
        .arm .back { transform: rotateY(180deg) translateZ(12px); }
        .arm .right { transform: rotateY(90deg) translateZ(12px); width: 24px; }
        .arm .left { transform: rotateY(-90deg) translateZ(12px); width: 24px; }
        .arm .top { transform: rotateX(90deg) translateZ(48px); height: 24px; background-color: #008CBA; } /* Shirt shoulder */
        .arm .bottom { transform: rotateX(-90deg) translateZ(48px); height: 24px; }

        /* Legs */
        .leg { width: 32px; height: 96px; top: 180px; }
        .leg-left { left: 68px; }
        .leg-right { left: 100px; }
        .leg .face { width: 32px; height: 96px; background-color: #4B0082; } /* Pants */
        .leg .front { transform: translateZ(16px); }
        .leg .back { transform: rotateY(180deg) translateZ(16px); }
        .leg .right { transform: rotateY(90deg) translateZ(16px); width: 32px; }
        .leg .left { transform: rotateY(-90deg) translateZ(16px); width: 32px; }
        .leg .top { transform: rotateX(90deg) translateZ(48px); height: 32px; background-color: #000080; }
        .leg .bottom { transform: rotateX(-90deg) translateZ(48px); height: 32px; background-color: #333; } /* Shoes */

    </style>
</head>
<body>

    <h1>Improved Icons Test</h1>
    <div class="icon-container">
        <div class="icon-wrapper">
            <p>Entity Base</p>
            <img src="plugins/mcreator-themes/themes/default_dark/images/mod_preview_bases/entity_base.png" alt="Entity Base">
        </div>
        <div class="icon-wrapper">
            <p>Built-in Model</p>
            <img src="plugins/mcreator-themes/themes/default_dark/images/model/small_builtin.png" alt="Built-in Model">
        </div>
    </div>

    <h1>HTML Minecraft Model</h1>
    <div class="scene">
        <div class="character">
            <!-- Head -->
            <div class="cube head">
                <div class="face front"></div>
                <div class="face back"></div>
                <div class="face right"></div>
                <div class="face left"></div>
                <div class="face top"></div>
                <div class="face bottom"></div>
            </div>
            <!-- Body -->
            <div class="cube body-torso">
                <div class="face front"></div>
                <div class="face back"></div>
                <div class="face right"></div>
                <div class="face left"></div>
                <div class="face top"></div>
                <div class="face bottom"></div>
            </div>
            <!-- Left Arm -->
            <div class="cube arm arm-left">
                <div class="face front"></div>
                <div class="face back"></div>
                <div class="face right"></div>
                <div class="face left"></div>
                <div class="face top"></div>
                <div class="face bottom"></div>
            </div>
            <!-- Right Arm -->
            <div class="cube arm arm-right">
                <div class="face front"></div>
                <div class="face back"></div>
                <div class="face right"></div>
                <div class="face left"></div>
                <div class="face top"></div>
                <div class="face bottom"></div>
            </div>
            <!-- Left Leg -->
            <div class="cube leg leg-left">
                <div class="face front"></div>
                <div class="face back"></div>
                <div class="face right"></div>
                <div class="face left"></div>
                <div class="face top"></div>
                <div class="face bottom"></div>
            </div>
            <!-- Right Leg -->
            <div class="cube leg leg-right">
                <div class="face front"></div>
                <div class="face back"></div>
                <div class="face right"></div>
                <div class="face left"></div>
                <div class="face top"></div>
                <div class="face bottom"></div>
            </div>
        </div>
    </div>

</body>
</html>
