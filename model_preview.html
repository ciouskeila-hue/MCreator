<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Muscle Villager</title>
    <style>
        body { font-family: sans-serif; background-color: #333; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        h1 { margin-bottom: 20px; }
        .icon-container { display: flex; gap: 20px; margin-bottom: 40px; }
        .icon-wrapper { text-align: center; border: 1px solid #555; padding: 10px; border-radius: 5px; background: #444; }
        img { image-rendering: pixelated; width: 64px; height: 64px; }

        /* Minecraft Character (CSS 3D) */
        .scene { width: 300px; height: 400px; perspective: 800px; margin-top: 50px; }
        .character { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; animation: rotate 8s infinite linear; }
        @keyframes rotate { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }

        .cube { position: absolute; transform-style: preserve-3d; }
        .face { position: absolute; background-size: 100% 100%; image-rendering: pixelated; border: 1px solid rgba(0,0,0,0.05); }

        /* Head (Standard 8x8x8 -> 64px) */
        .head { width: 64px; height: 64px; top: 20px; left: 118px; transform-origin: center center; }
        .head .face { width: 64px; height: 64px; background-color: #B58463; }
        .head .front { transform: translateZ(32px); background-image: url('texture_face.png'); }
        .head .back { transform: rotateY(180deg) translateZ(32px); background-color: #583A26; } /* Hair/Robe hood */
        .head .right { transform: rotateY(90deg) translateZ(32px); width: 64px; background-color: #B58463; }
        .head .left { transform: rotateY(-90deg) translateZ(32px); width: 64px; background-color: #B58463; }
        .head .top { transform: rotateX(90deg) translateZ(32px); height: 64px; background-color: #583A26; }
        .head .bottom { transform: rotateX(-90deg) translateZ(32px); height: 64px; }

        /* Nose (16x32) */
        .nose { width: 16px; height: 32px; top: 52px; left: 142px; transform-origin: center center; }
        .nose .face { width: 16px; height: 32px; background-color: #B58463; }
        .nose .front { transform: translateZ(40px); background-image: url('texture_nose.png'); }
        .nose .right { transform: rotateY(90deg) translateZ(8px); width: 16px; background-image: url('texture_nose.png'); }
        .nose .left { transform: rotateY(-90deg) translateZ(8px); width: 16px; background-image: url('texture_nose.png'); }
        .nose .top { transform: rotateX(90deg) translateZ(16px); height: 16px; background-color: #B58463; }
        .nose .bottom { transform: rotateX(-90deg) translateZ(16px); height: 16px; background-color: #8C644B; } /* Darker bottom */


        /* Body (Wider Chest: 96x96x48) */
        .body-torso { width: 96px; height: 96px; top: 84px; left: 102px; }
        .body-torso .face { width: 96px; height: 96px; background-color: #583A26; }
        .body-torso .front { transform: translateZ(24px); background-image: url('texture_torso.png'); }
        .body-torso .back { transform: rotateY(180deg) translateZ(24px); background-image: url('texture_torso.png'); }
        .body-torso .right { transform: rotateY(90deg) translateZ(48px); width: 48px; background-color: #583A26; }
        .body-torso .left { transform: rotateY(-90deg) translateZ(48px); width: 48px; background-color: #583A26; }
        .body-torso .top { transform: rotateX(90deg) translateZ(48px); height: 48px; background-color: #583A26; }
        .body-torso .bottom { transform: rotateX(-90deg) translateZ(48px); height: 48px; background-color: #583A26; }


        /* Arms (Muscle Arms: 48x96x48) */
        .arm { width: 48px; height: 96px; top: 84px; }
        .arm-left { left: 48px; } /* Slightly detached for muscle look */
        .arm-right { left: 204px; }
        .arm .face { width: 48px; height: 96px; background-color: #B58463; } /* Skin */
        .arm .front { transform: translateZ(24px); background-image: url('texture_arm.png'); }
        .arm .back { transform: rotateY(180deg) translateZ(24px); background-image: url('texture_arm.png'); }
        .arm .right { transform: rotateY(90deg) translateZ(24px); width: 48px; background-image: url('texture_arm.png'); }
        .arm .left { transform: rotateY(-90deg) translateZ(24px); width: 48px; background-image: url('texture_arm.png'); }
        .arm .top { transform: rotateX(90deg) translateZ(48px); height: 48px; background-color: #583A26; } /* Shoulder */
        .arm .bottom { transform: rotateX(-90deg) translateZ(48px); height: 48px; background-color: #B58463; }

        /* Legs (32x96x32) */
        .leg { width: 32px; height: 96px; top: 180px; }
        .leg-left { left: 118px; }
        .leg-right { left: 150px; }
        .leg .face { width: 32px; height: 96px; background-color: #583A26; }
        .leg .front { transform: translateZ(16px); background-image: url('texture_leg.png'); }
        .leg .back { transform: rotateY(180deg) translateZ(16px); background-image: url('texture_leg.png'); }
        .leg .right { transform: rotateY(90deg) translateZ(16px); width: 32px; background-image: url('texture_leg.png'); }
        .leg .left { transform: rotateY(-90deg) translateZ(16px); width: 32px; background-image: url('texture_leg.png'); }
        .leg .top { transform: rotateX(90deg) translateZ(48px); height: 32px; background-color: #583A26; }
        .leg .bottom { transform: rotateX(-90deg) translateZ(48px); height: 32px; background-color: #333; } /* Shoes */

        /* Lighting/Shading */
        .face { filter: brightness(0.9); }
        .top { filter: brightness(1.1); }
        .bottom { filter: brightness(0.6); }
        .right, .left { filter: brightness(0.8); }

    </style>
</head>
<body>

    <h1>Muscle Villager (High Quality Textures)</h1>
    <div class="icon-container">
        <div class="icon-wrapper">
            <p>Entity Base</p>
            <img src="plugins/mcreator-themes/themes/default_dark/images/mod_preview_bases/entity_base.png" alt="Entity Base">
        </div>
        <div class="icon-wrapper">
            <p>Built-in Model</p>
            <img src="plugins/mcreator-themes/themes/default_dark/images/model/small_builtin.png" alt="Built-in Model">
        </div>
    </div>

    <div class="scene">
        <div class="character">
            <!-- Head -->
            <div class="cube head">
                <div class="face front"></div>
                <div class="face back"></div>
                <div class="face right"></div>
                <div class="face left"></div>
                <div class="face top"></div>
                <div class="face bottom"></div>
            </div>
            <!-- Nose -->
            <div class="cube nose">
                <div class="face front"></div>
                <div class="face right"></div>
                <div class="face left"></div>
                <div class="face top"></div>
                <div class="face bottom"></div>
            </div>
            <!-- Body -->
            <div class="cube body-torso">
                <div class="face front"></div>
                <div class="face back"></div>
                <div class="face right"></div>
                <div class="face left"></div>
                <div class="face top"></div>
                <div class="face bottom"></div>
            </div>
            <!-- Left Arm (Muscle) -->
            <div class="cube arm arm-left">
                <div class="face front"></div>
                <div class="face back"></div>
                <div class="face right"></div>
                <div class="face left"></div>
                <div class="face top"></div>
                <div class="face bottom"></div>
            </div>
            <!-- Right Arm (Muscle) -->
            <div class="cube arm arm-right">
                <div class="face front"></div>
                <div class="face back"></div>
                <div class="face right"></div>
                <div class="face left"></div>
                <div class="face top"></div>
                <div class="face bottom"></div>
            </div>
            <!-- Left Leg -->
            <div class="cube leg leg-left">
                <div class="face front"></div>
                <div class="face back"></div>
                <div class="face right"></div>
                <div class="face left"></div>
                <div class="face top"></div>
                <div class="face bottom"></div>
            </div>
            <!-- Right Leg -->
            <div class="cube leg leg-right">
                <div class="face front"></div>
                <div class="face back"></div>
                <div class="face right"></div>
                <div class="face left"></div>
                <div class="face top"></div>
                <div class="face bottom"></div>
            </div>
        </div>
    </div>

</body>
</html>
